<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="180" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg" style="background-color: #f9f5eb">
  <!-- 上卦: ☷ -->
  
    <line x1="0" y1="18" x2="120" y2="18" stroke="#8b5a2b" stroke-width="3"/>
    <line x1="180" y1="18" x2="300" y2="18" stroke="#8b5a2b" stroke-width="3"/>
    <line x1="0" y1="45" x2="120" y2="45" stroke="#8b5a2b" stroke-width="3"/>
    <line x1="180" y1="45" x2="300" y2="45" stroke="#8b5a2b" stroke-width="3"/>
    <line x1="0" y1="72" x2="120" y2="72" stroke="#8b5a2b" stroke-width="3"/>
    <line x1="180" y1="72" x2="300" y2="72" stroke="#8b5a2b" stroke-width="3"/>
  
  <!-- 分隔线 -->
  <line x1="0" y1="90" x2="300" y2="90" stroke="#8b5a2b" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  
  <!-- 下卦: ☲ -->
  
    <!-- 左边小火焰 -->
    <path d="M60,162 Q45,144 75,126 Q60,108 90,103.5" stroke="#8b5a2b" stroke-width="1.5" fill="none"/>
    <!-- 中间大火焰 -->
    <path d="M150,166.5 Q120,144 150,117 Q135,99 150,94.5" stroke="#8b5a2b" stroke-width="2.5" fill="none"/>
    <!-- 右边小火焰 -->
    <path d="M240,162 Q255,144 225,126 Q240,108 210,103.5" stroke="#8b5a2b" stroke-width="1.5" fill="none"/>
    <!-- 火焰顶端光点 -->
    <circle cx="150" cy="94.5" r="2" fill="#8b5a2b"/>
  
  <!-- 卦名 -->
  <text x="290" y="170" font-size="14" fill="#8b5a2b" font-family="serif" text-anchor="end" style="font-style: italic">地火明夷</text>
</svg>